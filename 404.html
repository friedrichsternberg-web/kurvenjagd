<!DOCTYPE html>
<!-- Die Seite fuer eine Adresse, die es nicht gibt. GitHub Pages liefert sie
     bei jedem 404 aus. Ein alter Link soll nicht ins Leere fuehren, sondern
     in die App - und Google soll einen echten 404 sehen, keinen leeren
     Bildschirm (doku/SEO.md). -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden | Serpa</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="stylesheet" href="/stil/design.css">
  <link rel="stylesheet" href="/stil/seiten.css">
</head>
<body>
  <header class="seite-kopf">
    <a class="seite-marke" href="/"><img src="/img/logo-serpa.webp" alt="Serpa" width="800" height="155"></a>
    <nav aria-label="Seiten"><a href="/ueber/">Über Serpa</a><a href="/motorrad-routenplaner/">Routenplaner</a><a href="/motorrad-reise-planen/">Reise planen</a><a href="/motorrad-ausfahrt-mit-freunden/">Mit Freunden</a></nav>
    <a class="seite-knopf" href="/">App öffnen</a>
  </header>
  <main>
    <h1>Diese Seite gibt es nicht</h1>
    <p class="lead">Vielleicht ist der Link alt, oder beim Kopieren ist ein Stück verlorengegangen. Die App selbst ist da:</p>
    <p class="cta"><a class="seite-knopf" href="/">Serpa öffnen</a><a class="seite-knopf ruhig" href="/ueber/">Was Serpa ist</a></p>
  </main>
</body>
</html>
